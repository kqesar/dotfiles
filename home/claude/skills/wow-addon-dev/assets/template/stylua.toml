# Formatage Lua du projet.
#
# Tabulations et 120 colonnes : convention du code Blizzard et de BigWigs.
# `stylua .` formate, `stylua --check .` vérifie (ce que fait le hook).
column_width = 120
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
